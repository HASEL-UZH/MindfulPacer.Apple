<text x="676" y="1168" font-size="21" font-weight="400" fill="#B1C2D3" text-anchor="start">HealthKit · WatchConnectivity</text>
<text x="676" y="1196" font-size="21" font-weight="400" fill="#B1C2D3" text-anchor="start">Notifications · network endpoints</text>
</g>
<rect x="1130" y="240" width="406" height="354" rx="20" fill="#192A3B" stroke="#35495D"/>
<text x="1158" y="277" font-size="17" font-weight="700" fill="#51D8B4" text-anchor="start" letter-spacing="1.5">COMPOSITION</text>
<text x="1158" y="320" font-size="26" font-weight="650" fill="#ECF2F8" text-anchor="start">Application + Factory</text>
<text x="1158" y="360" font-size="21" font-weight="400" fill="#B1C2D3" text-anchor="start">Builds and injects collaborators.</text>
<text x="1158" y="389" font-size="21" font-weight="400" fill="#B1C2D3" text-anchor="start">Owns their lifetimes.</text>
<text x="1158" y="440" font-size="22" font-weight="500" fill="#ECF2F8" text-anchor="start">ScenesContainer</text>
<text x="1158" y="472" font-size="22" font-weight="500" fill="#ECF2F8" text-anchor="start">UseCasesContainer</text>
<text x="1158" y="504" font-size="22" font-weight="500" fill="#ECF2F8" text-anchor="start">DataContainer</text>
<text x="1158" y="558" font-size="19" font-weight="400" fill="#B1C2D3" text-anchor="start">No feature-level service lookup.</text>
<rect x="1130" y="634" width="406" height="290" rx="20" fill="#192A3B" stroke="#35495D"/>
<text x="1158" y="671" font-size="17" font-weight="700" fill="#51D8B4" text-anchor="start" letter-spacing="1.5">SHARED TYPES</text>
<text x="1158" y="714" font-size="26" font-weight="650" fill="#ECF2F8" text-anchor="start">Models + pure rules</text>
<text x="1158" y="757" font-size="21" font-weight="400" fill="#B1C2D3" text-anchor="start">Explicit values and decisions</text>
<text x="1158" y="789" font-size="21" font-weight="400" fill="#B1C2D3" text-anchor="start">No hidden effects in pure rules</text>
<text x="1158" y="821" font-size="21" font-weight="400" fill="#B1C2D3" text-anchor="start">SwiftData models may be shared</text>
<text x="1158" y="853" font-size="21" font-weight="400" fill="#B1C2D3" text-anchor="start">DTOs stay at integration edges</text>
<rect x="1130" y="964" width="406" height="262" rx="20" fill="#192A3B" stroke="#35495D"/>
<text x="1158" y="1001" font-size="17" font-weight="700" fill="#F3C477" text-anchor="start" letter-spacing="1">LIMITED READ EXCEPTION</text>
<text x="1158" y="1044" font-size="25" font-weight="650" fill="#ECF2F8" text-anchor="start">Local presentation reads</text>
<text x="1158" y="1084" font-size="21" font-weight="400" fill="#B1C2D3" text-anchor="start">View: read-only @Query</text>
<text x="1158" y="1116" font-size="21" font-weight="400" fill="#B1C2D3" text-anchor="start">ViewModel: injected context</text>
<text x="1158" y="1148" font-size="21" font-weight="400" fill="#B1C2D3" text-anchor="start">Simple local projections only.</text>
<text x="1158" y="1180" font-size="21" font-weight="400" fill="#B1C2D3" text-anchor="start">All writes go through Use Cases.</text>
<path d="M 64 1270 H 1536" stroke="#35495D" stroke-width="1.5"/>
<path d="M 66 1310 H 123" fill="none" stroke="#849BB1" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#normal-arrow)"/>
<text x="140" y="1317" font-size="20" font-weight="400" fill="#B1C2D3" text-anchor="start">Principal use through contracts¹</text>
<path d="M 520 1310 H 577" fill="none" stroke="#F3C477" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="9 8" marker-end="url(#optional-arrow)"/>
<text x="594" y="1317" font-size="20" font-weight="400" fill="#B1C2D3" text-anchor="start">Permitted direct path</text>
<text x="64" y="1350" font-size="18" font-weight="400" fill="#B1C2D3" text-anchor="start">¹ Application / infrastructure boundaries use injected contracts. Results flow back; dependencies do not.</text>
</g>
