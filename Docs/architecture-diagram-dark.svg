<text x="676" y="868" font-size="21" font-weight="400" fill="#B1C2D3" text-anchor="start">Own integration mechanics</text>
<text x="676" y="896" font-size="21" font-weight="400" fill="#B1C2D3" text-anchor="start">SDK sessions · requests · events</text>
</g>
<text x="120" y="1070" font-size="17" font-weight="700" fill="#B1C2D3" text-anchor="start">04</text>
<text x="156" y="1070" font-size="17" font-weight="650" fill="#B1C2D3" text-anchor="start" letter-spacing="1.5">SYSTEMS</text>
<g id="persistence">
<rect x="120" y="1090" width="370" height="136" rx="20" fill="#1B324C" stroke="#35495D"/>
<rect x="120" y="1116" width="4" height="84" rx="2" fill="#87B9FF"/>
