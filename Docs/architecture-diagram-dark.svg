<text x="120" y="640" font-size="21" font-weight="400" fill="#B1C2D3" text-anchor="start">Simple use case + injected context</text>
<text x="120" y="220" font-size="17" font-weight="700" fill="#87B9FF" text-anchor="start">01</text>
<text x="156" y="220" font-size="17" font-weight="650" fill="#B1C2D3" text-anchor="start" letter-spacing="1.5">PRESENTATION</text>
<g id="views">
