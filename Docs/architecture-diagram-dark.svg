<text x="146" y="868" font-size="21" font-weight="400" fill="#B1C2D3" text-anchor="start">Own data-access behavior</text>
<text x="146" y="896" font-size="21" font-weight="400" fill="#B1C2D3" text-anchor="start">Queries · caching · mapping</text>
</g>
<g id="services">
