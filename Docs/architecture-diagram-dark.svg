<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1370" viewBox="0 0 1600 1370" role="img" aria-labelledby="title description">
<title id="title">MindfulPacer intended application architecture</title>
<desc id="description">Views use ViewModels, which invoke Use Cases. Use Cases call Repository or Service contracts. Repositories access persistence and may call Services; Services adapt platform APIs. A dashed path permits simple Use Cases to access injected persistence directly. Side panels describe application composition, shared models and pure rules, and constrained read-only presentation queries.</desc>
