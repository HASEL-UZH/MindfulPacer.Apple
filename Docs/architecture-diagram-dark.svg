<text x="146" y="318" font-size="21" font-weight="400" fill="#B1C2D3" text-anchor="start">Render observable state</text>
<text x="146" y="346" font-size="21" font-weight="400" fill="#B1C2D3" text-anchor="start">Layout · interaction · accessibility</text>
</g>
<g id="view-models">
<rect x="650" y="240" width="390" height="136" rx="20" fill="#1B324C" stroke="#35495D"/>
<rect x="650" y="266" width="4" height="84" rx="2" fill="#87B9FF"/>
<text x="676" y="282" font-size="28" font-weight="650" fill="#ECF2F8" text-anchor="start">ViewModels</text>
<text x="676" y="318" font-size="21" font-weight="400" fill="#B1C2D3" text-anchor="start">Own screen and draft state</text>
<text x="676" y="346" font-size="21" font-weight="400" fill="#B1C2D3" text-anchor="start">Translate intent into operations</text>
</g>
<text x="650" y="459" font-size="17" font-weight="700" fill="#51D8B4" text-anchor="start">02</text>
<text x="686" y="459" font-size="17" font-weight="650" fill="#B1C2D3" text-anchor="start" letter-spacing="1.5">APPLICATION</text>
<g id="use-cases">
<rect x="650" y="480" width="390" height="136" rx="20" fill="#163A38" stroke="#35495D"/>
<rect x="650" y="506" width="4" height="84" rx="2" fill="#51D8B4"/>
<text x="676" y="522" font-size="28" font-weight="650" fill="#ECF2F8" text-anchor="start">Use Cases</text>
<text x="676" y="558" font-size="21" font-weight="400" fill="#B1C2D3" text-anchor="start">Apply application rules</text>
<text x="676" y="586" font-size="21" font-weight="400" fill="#B1C2D3" text-anchor="start">Coordinate operations and effects</text>
</g>
<text x="120" y="770" font-size="17" font-weight="700" fill="#C3ADFF" text-anchor="start">03</text>
<text x="156" y="770" font-size="17" font-weight="650" fill="#B1C2D3" text-anchor="start" letter-spacing="1.5">INFRASTRUCTURE</text>
<g id="repositories">
<rect x="120" y="790" width="370" height="136" rx="20" fill="#302D47" stroke="#35495D"/>
